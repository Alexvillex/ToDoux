name: ToDoux CI/CD

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🛠️ Install Web Tools
        run: npx expo install react-native-web react-dom @expo/webpack-config -- --legacy-peer-deps

      - name: 🏗️ Build Web
        run: npx expo export:web
        env:
          PUBLIC_URL: /ToDoux/

      - name: 🔧 Fix chemins pour GitHub Pages
        run: |
          sed -i 's|src="/static/|src="/ToDoux/static/|g' web-build/index.html
          sed -i 's|href="/manifest|href="/ToDoux/manifest|g' web-build/index.html
          sed -i 's|href="/favicon|href="/ToDoux/favicon|g' web-build/index.html
          sed -i 's|href="/pwa/|href="/ToDoux/pwa/|g' web-build/index.html
          echo "=== index.html après correction ==="
          cat web-build/index.html

      - name: 📄 Ajouter .nojekyll
        run: touch web-build/.nojekyll

      - name: 🚀 Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web-build
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
